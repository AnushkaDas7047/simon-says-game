    <title>Simon-Says-Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Simon Says Game</h1>
    <h2></h2>
    
    

    <button class="strBtn">Start The Game</button>
    <div class="btn-container">
        <div class="line-one">
             <div class="btn red" id="red"><h3> <b> Pink </b></h3></div>
            <div class="btn yellow" id="yellow"><h3> <b> yellow </b></h3></div>

        </div>
        <div class="line-two">
            <div class="btn green" id="green"> <h3> <b> Green </b></h3></div>
            <div class="btn purple" id = "purple"> <h3> <b> Blue </b></h3></div>

        </div>
       
        
    </div>
    <script src="app.js"></script>
